# Render Blueprint: one web service (the Dockerfile: web app + API) and one Postgres database.
# In Render: New > Blueprint > pick this repo. SECRET_KEY is generated by Render and never stored in git.
# "free" plans are for trying it out: the web service sleeps when idle (first visit then takes about a minute)
# and free databases expire. Switch both to paid plans in the dashboard before the team relies on it.
services:
  - type: web
    name: tasking
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tasking-db
          property: connectionString

databases:
  - name: tasking-db
    databaseName: tasking
    plan: free
