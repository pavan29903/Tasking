# Render Blueprint: one web service (the Dockerfile: web app + API).
# In Render: New > Blueprint > pick this repo. SECRET_KEY is generated by Render and never stored in git.
# The database is Postgres hosted elsewhere (e.g. Neon's free plan, which does not expire): paste its connection
# string into DATABASE_URL in the service's Environment page. It is never stored in git either.
# The "free" web plan sleeps when idle, so the first visit after a quiet spell takes about a minute.
services:
  - type: web
    name: tasking
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # set in the Render dashboard
